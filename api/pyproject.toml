# API project: FastAPI, Python 3.12, uv, ruff, mypy, pytest. Exact pinned versions.
# Owner: B. Filled in by: B0.

[project]
name = "scam-map-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
