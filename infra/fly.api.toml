# Fly.io config for the API: the HTTPS address the judges test. Deploy from the repo root:
#   fly deploy . --config infra/fly.api.toml --dockerfile infra/Dockerfile
# Change `app` to a unique name; the address becomes https://<app>.fly.dev.
# Owner: A. Filled in by: A0.

app = "scam-map-api-shubhang"
primary_region = "sin"

[env]
  SCAM_MAP_DB_PATH = "/data/scam_map.sqlite"
  PORT = "8000"

[[mounts]]
  source = "scam_map_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: a sleeping machine would break the half-second lookup rule.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
