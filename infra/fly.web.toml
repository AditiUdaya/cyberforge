# Fly.io config for the Streamlit web app: the mobile website link. Deploy from the repo root:
#   fly deploy . --config infra/fly.web.toml --dockerfile infra/Dockerfile.web
# Change `app` to a unique name and SCAM_MAP_API_URL to the API's address.
# Owner: A. Filled in by: A0.

app = "scam-map-web-shubhang"
primary_region = "sin"

[env]
  SCAM_MAP_API_URL = "https://scam-map-api-shubhang.fly.dev"
  PORT = "8501"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/_stcore/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
