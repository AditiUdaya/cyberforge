# Streamlit settings for the mobile website: quiet, private, no error details shown to users.
# Owner: A. Filled in by: A0.

[server]
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[logger]
level = "warning"

[theme]
base = "light"
primaryColor = "#00d884"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#eefaf4"
textColor = "#1c1c1c"
