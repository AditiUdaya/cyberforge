# Mobile web app: Streamlit, Python 3.12, calls the API over HTTPS. Exact pinned versions.
# Owner: A. Filled in by: A0.

[project]
name = "scam-map-web"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "streamlit==1.66.1",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
